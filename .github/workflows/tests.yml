name: Tests

on:
  push:
    branches: [main, codex/mero-2300, feat/torch-screlu-512, feat/torch-bounded-residual, feat/bullet-selfplay, feat/bullet-metal-pilot, feat/uci-search-control, feat/mero7-streamed-selfplay]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build native C evaluator
        run: python scripts/build_native.py --native-arch
      - name: Validate native-architecture and portable neural kernels
        run: |
          python scripts/build_native.py --native-arch --bounded512 --output-dir build/bounded
          python -m scripts.check_screlu_fixtures build/bounded/mwahaha-engine
          python scripts/build_native.py --bounded512 --scalar-only --output-dir build/scalar
          python -m scripts.check_screlu_fixtures build/scalar/mwahaha-engine
      - name: Verify optional Metal-trained checkpoint on Linux
        run: |
          python scripts/build_native.py --native-arch --screlu training/checkpoints/mero-bullet-pilot.bin --output-dir build/bullet
          python -m scripts.check_screlu_fixtures build/bullet/mwahaha-engine --weights training/checkpoints/mero-bullet-pilot.bin --fixture tests/bullet_golden.json
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile both untrained standalone-width fixtures (no training data required)
        run: |
          for width in 256 384; do
            python -m training.scale_fixture "$width" "build/probe-$width.bin"
            python scripts/build_native.py --native-arch --screlu "build/probe-$width.bin" --output-dir "build/n$width"
            printf '4k3/8/8/8/8/8/8/3QK3 w - - 0 1\n' | "build/n$width/mwahaha-engine" --static-scores
          done
      - name: Compile package
        run: python -m compileall -q chess_ai
      - name: Validate starting-position perft
        run: python -m chess_ai.perft --depth 3
      - name: Validate native-engine perft
        run: build/native/mwahaha-engine --perft 4
      - name: Smoke-test native UCI
        run: |
          printf 'uci\nisready\nposition startpos\ngo movetime 50\n' |
            build/native/mwahaha-engine

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build instrumented native engine
        run: python scripts/build_native.py --sanitize --output-dir build/sanitized
      - name: Validate instrumented move generation and hashing
        run: |
          build/sanitized/mwahaha-engine --perft 4
          build/sanitized/mwahaha-engine --verify-keys 3
          build/sanitized/mwahaha-engine --verify-bitboards 3
          build/sanitized/mwahaha-engine --verify-keys-fen 3 '4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1'
          build/sanitized/mwahaha-engine --perft-fen 3 'r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1'
      - name: Exercise bounded search under sanitizers
        run: |
          printf 'uci\nposition startpos\ngo nodes 100000\n' |
            build/sanitized/mwahaha-engine
