name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build native C evaluator
        run: python scripts/build_native.py
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Compile package
        run: python -m compileall -q chess_ai
      - name: Validate starting-position perft
        run: python -m chess_ai.perft --depth 3
      - name: Validate native-engine perft
        run: build/native/mwahaha-engine --perft 4
      - name: Smoke-test native UCI
        run: |
          printf 'uci\nisready\nposition startpos\ngo movetime 50\nquit\n' |
            build/native/mwahaha-engine
