[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwahaha-chess-engine"
version = "3.0.0"
description = "Mero: a Python, C, and C++ chess engine with native search"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mohammed Nabid" }]

[project.scripts]
mwahaha-chess = "chess_ai.cli:main"
mwahaha-uci = "chess_ai.uci:main"
mwahaha-backtest = "chess_ai.backtest:main"
mwahaha-gauntlet = "chess_ai.gauntlet:main"
mwahaha-perft = "chess_ai.perft:main"

[tool.setuptools.packages.find]
include = ["chess_ai*"]
